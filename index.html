<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohammed's Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --clip-x: 50%;
            --clip-y: 50%;
            --color-primary-start: #22d3ee;
            --color-primary-end: #a855f7;
            --color-primary: #22d3ee;
            --color-primary-stronger: #a855f7;
            --color-glow: #22d3ee40;
        }
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Dynamic Colors & Gradients */
        .dynamic-gradient-text {
            background-image: linear-gradient(to right, var(--color-primary-start), var(--color-primary-end));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .dynamic-gradient-bg {
            background-image: linear-gradient(to right, var(--color-primary-start), var(--color-primary-end));
        }
        .dynamic-text { color: var(--color-primary); }
        .dynamic-bg { background-color: var(--color-primary); }
        .dynamic-bg-hover:hover { background-color: var(--color-primary-stronger); }
        .dynamic-ring { --tw-ring-color: var(--color-primary); }
        .dynamic-focus-ring:focus { --tw-ring-color: var(--color-primary); }
        .dynamic-border { border-color: var(--color-primary); }
        .dynamic-shadow-hover:hover {
            box-shadow: 0 10px 15px -3px var(--color-glow), 0 4px 6px -4px var(--color-glow);
        }
        .dynamic-icon { color: var(--color-primary); }


        /* Theme Transition */
        #theme-transition-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            pointer-events: none;
            clip-path: circle(0% at var(--clip-x) var(--clip-y));
            transition: clip-path 0.8s cubic-bezier(0.68, -0.6, 0.32, 1.6);
        }
        #theme-transition-overlay.active {
            clip-path: circle(150% at var(--clip-x) var(--clip-y));
        }

        /* Improved Animations */
        @keyframes fade-in-down {
            from { opacity: 0; transform: translateY(-20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .motion-safe\:animate-fade-in-down { animation: fade-in-down 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .motion-safe\:animate-fade-in-up { animation: fade-in-up 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        
        /* Typewriter Cursor */
        @keyframes blink-cursor {
            from, to { opacity: 1; }
            50% { opacity: 0; }
        }
        .motion-safe\:animate-blink-cursor {
            animation: blink-cursor 0.75s step-end infinite;
        }

        /* Starfield Background */
        @keyframes star-twinkle {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        .motion-safe\:animate-star-twinkle { animation: star-twinkle 4s infinite ease-in-out; }
        @keyframes satellite-orbit {
            0% { transform: translate(100vw, -10vh) rotate(225deg); }
            100% { transform: translate(-20vw, 120vh) rotate(225deg); }
        }
        .motion-safe\:animate-satellite-orbit { animation: satellite-orbit 60s linear infinite; }
        @keyframes nebula-drift-1 {
            0% { transform: translate(0, 0) scale(1); opacity: 0.1; }
            50% { transform: translate(20px, -30px) scale(1.1); opacity: 0.15; }
            100% { transform: translate(0, 0) scale(1); opacity: 0.1; }
        }
        @keyframes nebula-drift-2 {
            0% { transform: translate(0, 0) scale(1); opacity: 0.1; }
            50% { transform: translate(-25px, 40px) scale(1.15); opacity: 0.12; }
            100% { transform: translate(0, 0) scale(1); opacity: 0.1; }
        }

        /* Light Theme Background */
        @keyframes sun-pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 60px 20px rgba(253, 224, 71, 0.35); }
            50% { transform: scale(1.03); box-shadow: 0 0 80px 30px rgba(253, 224, 71, 0.5); }
        }
        .motion-safe\:animate-sun-pulse { animation: sun-pulse 8s infinite ease-in-out; }
        @keyframes cloud-drift-1 {
            0% { transform: translateX(0); }
            100% { transform: translateX(200vw); }
        }
        .motion-safe\:animate-cloud-drift-1 { animation: cloud-drift-1 120s linear infinite; }
        @keyframes cloud-drift-2 {
            0% { transform: translateX(0); }
            100% { transform: translateX(-200vw); }
        }
        .motion-safe\:animate-cloud-drift-2 { animation: cloud-drift-2 90s linear infinite; }
        @keyframes god-rays {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            50% { opacity: 0.08; }
            100% { transform: translateY(-100vh) rotate(10deg); opacity: 0; }
        }
        .god-ray {
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 150%;
            background: linear-gradient(to bottom, rgba(255, 255, 240, 0.5), transparent);
            transform-origin: top center;
            animation: god-rays 20s linear infinite;
        }

        
        /* Easter Eggs */
        @keyframes sun-flash {
            0%, 100% { box-shadow: 0 0 60px 20px rgba(253, 224, 71, 0.4); }
            50% { box-shadow: 0 0 120px 50px rgba(253, 224, 71, 0.8); }
        }
        .motion-safe\:animate-sun-flash { animation: sun-flash 0.5s ease-in-out; }
        @keyframes sun-flare {
            from { transform: scale(0); opacity: 0.8; }
            to { transform: scale(4); opacity: 0; }
        }
        .sun-flare {
            position: absolute; width: 80px; height: 2px; background: white;
            animation: sun-flare 0.6s ease-out forwards;
        }
        @keyframes moon-wink {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.1); }
        }
        .motion-safe\:animate-moon-wink { animation: moon-wink 0.5s ease-in-out; }
        @keyframes shooting-star {
            0% { transform: translateX(0) translateY(0) scale(1); opacity: 1; }
            100% { transform: translateX(-250px) translateY(250px) scale(0); opacity: 1; }
        }
        .shooting-star {
            position: absolute; width: 100px; height: 2px;
            background: linear-gradient(to left, white, transparent);
            border-radius: 50%; transform: rotate(-45deg);
            animation: shooting-star 1.2s ease-in forwards;
        }

        /* Animated Project Border */
        @keyframes rotate-border {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animated-border-wrapper {
            position: relative;
            padding: 2px;
            overflow: hidden;
            border-radius: 18px; /* sync with card's rounded-2xl */
        }
        .animated-border-wrapper::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(
                from 90deg at 50% 50%,
                transparent 0%,
                var(--color-primary, #06b6d4) 50%,
                transparent 100%
            );
            animation: rotate-border 4s linear infinite;
        }

        /* Image Loading Animation */
        @keyframes image-load-in {
            from { opacity: 0; filter: blur(5px); transform: scale(1.05); }
            to { opacity: 1; filter: blur(0px); transform: scale(1); }
        }
        .image-loading {
            background-color: #e5e7eb; /* gray-200 */
        }
        .dark .image-loading {
            background-color: #374151; /* gray-700 */
        }
        .image-loaded {
            animation: image-load-in 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* Toast */
        @keyframes toast-in {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes toast-out {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(20px); }
        }
        .motion-safe\:animate-toast-in { animation: toast-in 0.5s forwards; }
        .motion-safe\:animate-toast-out { animation: toast-out 0.5s forwards; }

        /* Animated Bear */
        .animate-bear-hide, .animate-bear-peek, .animate-bear-climb {
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
        }
        .animate-bear-hide { transform: translateY(calc(100% - 40px)); }
        .animate-bear-peek { transform: translateY(calc(100% - 70px)); }
        .animate-bear-climb { transform: translateY(10px); }

        @keyframes bear-blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }
        .bear-eye {
            animation: bear-blink 4s infinite ease-in-out;
            transform-origin: center;
        }
        
        /* Bear Celebration */
        .celebration-container {
            position: fixed;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 200px;
            z-index: 100;
            pointer-events: none;
        }
        @keyframes celebrate-bear-appear {
            0% { transform: translateY(100%) scale(0.5); opacity: 0; }
            60% { transform: translateY(-20px) scale(1.1); opacity: 1; }
            80% { transform: translateY(8px) scale(0.95); }
            95% { transform: translateY(-4px) scale(1.02); }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        @keyframes celebrate-bear-skills {
            0% { transform: rotate(0deg) scale(1); }
            20% { transform: rotate(-10deg) scale(1.05) translateX(-5px); }
            40% { transform: rotate(10deg) scale(1.05) translateX(5px); }
            60% { transform: rotate(-5deg) scale(1); }
            80% { transform: rotate(5deg) scale(1); }
            100% { transform: rotate(0deg) scale(1); }
        }
        @keyframes celebrate-bear-disappear {
            from { transform: translateY(0) scale(1); opacity: 1; }
            to { transform: translateY(100%) scale(0.5); opacity: 0; }
        }
        .celebration-bear-anim {
            animation: celebrate-bear-appear 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
                       celebrate-bear-skills 0.8s ease-in-out 1.5s forwards,
                       celebrate-bear-disappear 0.6s cubic-bezier(0.6, -0.28, 0.74, 0.05) 2.4s forwards;
        }
        @keyframes confetti-pop {
            0% {
                transform: translateY(20%) scale(0);
                opacity: 1;
            }
            100% {
                transform: translateY(var(--end-y, -250px)) translateX(var(--end-x, 0px)) scale(1) rotate(var(--end-rot, 720deg));
                opacity: 0;
            }
        }
        .confetti {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            opacity: 0;
            animation: confetti-pop ease-out forwards;
        }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "@heroicons/react/": "https://aistudiocdn.com/@heroicons/react@^2.2.0/",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
      }
    }
    </script>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
